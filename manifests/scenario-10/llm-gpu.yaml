# Scenario 10 — GPU-accelerated llama-server. Requires:
#   minikube start --profile=gpu --driver=krunkit --memory=12288 --cpus=6 \
#       --mount-string ~/models:/mnt/models
#   and the GGUF model downloaded into ~/models (see the scenario guide).
apiVersion: apps/v1
kind: Deployment
metadata: {name: llm-gpu}
spec:
  replicas: 1
  selector: {matchLabels: {app: llm-gpu}}
  template:
    metadata: {labels: {app: llm-gpu}}
    spec:
      containers:
      - name: llama-server
        image: quay.io/ramalama/ramalama:latest
        command: [llama-server]
        args: [--host, "0.0.0.0", --port, "8080",
               --model, /mnt/models/tinyllama-1.1b-chat-v1.0.Q8_0.gguf,
               --ctx-size, "2048", -ngl, "999",   # -ngl 999 = ALL layers to the GPU
               --threads, "6", --no-warmup]
        ports: [{containerPort: 8080}]
        resources:
          limits:
            devic.es/dri: 1
            memory: 4Gi
        volumeMounts: [{name: models, mountPath: /mnt/models}]
      volumes:
      - name: models
        hostPath: {path: /mnt/models}
