# Scenario 7 — 12 replicas forced to spread evenly across zones (label nodes first)
apiVersion: apps/v1
kind: Deployment
metadata: {name: spread-app}
spec:
  replicas: 12
  selector: {matchLabels: {app: spread-app}}
  template:
    metadata: {labels: {app: spread-app}}
    spec:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector: {matchLabels: {app: spread-app}}
      containers:
      - name: app
        image: nginx:1.27
        resources: {requests: {cpu: 100m, memory: 64Mi}}
