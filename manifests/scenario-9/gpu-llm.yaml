# Front a NATIVE macOS Ollama (Metal-accelerated) from inside the cluster.
# Replace HOST_IP first:
#   HOSTIP=$(minikube ssh -p practice "grep host.minikube.internal /etc/hosts | cut -f1" | tr -d '\r')
#   sed "s/HOST_IP/$HOSTIP/" gpu-llm.yaml | kubectl apply -f -
apiVersion: v1
kind: Service
metadata: {name: gpu-llm}
spec:
  ports: [{port: 11434, targetPort: 11434}]
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: gpu-llm-1
  labels: {kubernetes.io/service-name: gpu-llm}
addressType: IPv4
ports: [{port: 11434, protocol: TCP}]
endpoints:
- addresses: ["HOST_IP"]
